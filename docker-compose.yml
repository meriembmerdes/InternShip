services:
  postgres:
    image: postgres:16-alpine
    container_name: internflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: internflow
      POSTGRES_USER: internflow
      POSTGRES_PASSWORD: internflow
    ports:
      - "5432:5432"
    volumes:
      - internflow_pgdata:/var/lib/postgresql/data

volumes:
  internflow_pgdata: